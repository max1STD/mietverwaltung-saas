server {
    listen 5173;
    server_name _;

    root /root/mietverwaltung-saas/frontend/dist;
    index index.html;

    # Sichere Header
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Frontend-Assets: Cache für statische Dateien — aber index.html nie cachen
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Health, OpenAPI, Docs — direkt ans Backend weiterleiten
    location ~ ^/(health|openapi\.json|docs|redoc)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # API-Proxy an das FastAPI-Backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS-Header werden vom Backend gesetzt
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 50M;
    }

    # SPA-Fallback: alles andere geht an index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
