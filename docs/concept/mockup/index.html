<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0D3B70">
<title>MietVerwaltung — Vermieter- & Mieter-Portal</title>
<style>
/* === RESET & TOKENS === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --navy: #0D3B70;
  --navy-hover: #2a5a9e;
  --navy-light: #e8eff8;
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #1d1d1f;
  --text2: #6e6e73;
  --border: #e2e2e7;
  --green: #34c759;
  --green-bg: #e8f5e9;
  --orange: #ff9500;
  --orange-bg: #fff3e0;
  --red: #ff3b30;
  --red-bg: #ffebee;
  --blue: #007aff;
  --blue-bg: #e3f2fd;
  --radius-xl: 24px;
  --radius-lg: 18px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --radius-xs: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
  --shadow-float: 0 12px 40px rgba(0,0,0,0.14);
  --transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
html.dark {
  --navy: #1f6feb;
  --navy-hover: #58a6ff;
  --navy-light: rgba(31,111,235,0.12);
  --bg: #0d1117;
  --card: #161b22;
  --text: #e6edf3;
  --text2: #7d8597;
  --border: #30363d;
  --green: #3fb950;
  --green-bg: rgba(63,185,80,0.15);
  --orange: #ff9500;
  --orange-bg: rgba(255,149,0,0.15);
  --red: #ff453a;
  --red-bg: rgba(255,69,58,0.15);
  --blue: #58a6ff;
  --blue-bg: rgba(88,166,255,0.15);
}
html, body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
  min-height: 100vh;
}
input, select, textarea { font-size: 16px; }
button { cursor: pointer; border: none; background: none; font-family: inherit; }
a { color: var(--navy); text-decoration: none; }

/* === LAYOUT === */
.app-shell { display: flex; min-height: 100vh; }
.sidebar {
  width: 270px; background: var(--card); border-right: 1px solid var(--border);
  display: none; flex-direction: column; position: fixed; inset: 0 auto 0 0; z-index: 50;
  padding: 24px 18px calc(24px + var(--safe-bottom)) 18px;
}
.main {
  flex: 1; margin-left: 0; min-height: 100vh; display: flex; flex-direction: column;
  padding-bottom: calc(84px + var(--safe-bottom));
}
.content { flex: 1; padding: 20px; max-width: 1400px; width: 100%; margin: 0 auto; }
.topbar {
  height: 60px; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  justify-content: space-between; padding: 0 18px; position: sticky; top: 0; z-index: 40;
  transition: var(--transition);
}
html.dark .topbar { background: rgba(22,27,34,0.85); }
.topbar-title { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

body.auth-view .sidebar { display: none !important; }
body.auth-view .main { margin-left: 0 !important; }
body.auth-view .mobile-tabbar { display: none !important; }
body.auth-view .fab { display: none !important; }
body.auth-view .ai-bubble { display: none !important; }
body.tenant-view .sidebar { display: none !important; }
body.tenant-view .main { margin-left: 0 !important; }

@media (min-width: 1024px) {
  .sidebar { display: flex; }
  .main { margin-left: 270px; padding-bottom: 0; }
  .content { padding: 32px; }
  .topbar { display: none; }
  .mobile-tabbar { display: none !important; }
}

/* === NAVIGATION === */
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; padding: 0 10px; }
.brand-icon { width: 34px; height: 34px; background: var(--navy); border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 16px; }
.brand-text { font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }
.nav-list { list-style: none; flex: 1; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-sm);
  color: var(--text2); font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 4px;
  min-height: 44px; transition: var(--transition);
}
.nav-item:hover { background: var(--navy-light); color: var(--text); }
.nav-item.active { background: var(--navy-light); color: var(--navy); font-weight: 600; }
.nav-item svg { width: 22px; height: 22px; flex-shrink: 0; }
.nav-footer { padding: 18px 10px 0; border-top: 1px solid var(--border); margin-top: auto; font-size: 12px; color: var(--text2); }

/* === MOBILE BOTTOM TABBAR === */
.mobile-tabbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(68px + var(--safe-bottom)); padding-bottom: var(--safe-bottom);
  background: rgba(255,255,255,0.94); backdrop-filter: blur(20px);
  border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100;
  transition: var(--transition);
}
html.dark .mobile-tabbar { background: rgba(22,27,34,0.94); }
.tabbar-item {
  flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; font-size: 10px; font-weight: 500; color: var(--text2); cursor: pointer; transition: var(--transition);
}
.tabbar-item svg { width: 22px; height: 22px; }
.tabbar-item.active { color: var(--navy); }

/* === FAB & SPEED DIAL === */
.fab {
  position: fixed; bottom: calc(88px + var(--safe-bottom)); right: 20px; width: 58px; height: 58px;
  border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center;
  box-shadow: var(--shadow-float); z-index: 110; cursor: pointer; transition: var(--transition);
}
.fab:hover { transform: scale(1.05); }
.fab:active { transform: scale(0.95); }
.speed-dial {
  position: fixed; bottom: calc(156px + var(--safe-bottom)); right: 20px; display: none; flex-direction: column; gap: 12px; z-index: 109;
}
.speed-dial.open { display: flex; }
.speed-item { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.speed-label { background: var(--card); padding: 7px 12px; border-radius: var(--radius-sm); font-size: 12px; box-shadow: var(--shadow); font-weight: 500; }
.speed-btn { width: 46px; height: 46px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; cursor: pointer; transition: var(--transition); }
.speed-btn:hover { transform: scale(1.08); }
@media (min-width: 1024px) { .fab, .speed-dial { bottom: 32px; right: 32px; } .speed-dial { bottom: 100px; } }

/* === TYPOGRAPHY === */
h1, h2, h3, h4 { font-weight: 700; letter-spacing: -0.02em; }
h1 { font-size: 30px; } h2 { font-size: 24px; } h3 { font-size: 18px; } h4 { font-size: 15px; }
.subtitle { color: var(--text2); font-size: 15px; margin-top: 4px; }
.label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text2); margin-bottom: 6px; }

/* === CARDS === */
.card {
  background: var(--card); border-radius: var(--radius-md); box-shadow: var(--shadow);
  padding: 20px; transition: var(--transition);
}
.card-hover:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.card-xl { border-radius: var(--radius-lg); padding: 24px; }
.card-hero {
  border-radius: var(--radius-lg); padding: 28px;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-hover) 100%); color: #fff;
}
html.dark .card-hero { background: linear-gradient(135deg, #0d419d 0%, #1f6feb 100%); }
.card-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.card-sub { font-size: 14px; color: var(--text2); line-height: 1.4; }

/* === GRIDS === */
.grid-2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (min-width: 640px) {
  .grid-2 { grid-template-columns: repeat(2,1fr); gap: 20px; }
  .grid-3 { grid-template-columns: repeat(2,1fr); gap: 20px; }
  .grid-4 { grid-template-columns: repeat(4,1fr); gap: 16px; }
}
@media (min-width: 1024px) {
  .grid-3 { grid-template-columns: repeat(3,1fr); gap: 24px; }
}

/* === BUTTONS === */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
  border: 1px solid transparent; cursor: pointer; transition: var(--transition);
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--navy-hover); }
.btn-secondary { background: var(--card); color: var(--navy); border-color: var(--border); }
.btn-secondary:hover { background: var(--navy-light); }
.btn-ghost { background: transparent; color: var(--text2); }
.btn-danger { background: var(--red); color: #fff; }
.btn-lg { min-height: 52px; padding: 0 24px; font-size: 15px; border-radius: var(--radius-lg); width: 100%; }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* === FORMS === */
.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.form-input, .form-select, .form-textarea {
  width: 100%; min-height: 48px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-xs);
  background: var(--card); color: var(--text); font-size: 16px; transition: var(--transition);
}
.form-select { padding: 0 14px; }
.form-textarea { padding: 14px 16px; min-height: 110px; resize: vertical; }
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px var(--navy-light); }
.form-input::placeholder { color: var(--text2); opacity: 0.7; }
.checkbox-row { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--text2); min-height: 44px; }
.checkbox-row input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--navy); }

/* === BADGES === */
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.01em;
}
.badge-open { background: var(--orange-bg); color: #bf6f00; }
html.dark .badge-open { background: var(--orange-bg); color: var(--orange); }
.badge-progress { background: var(--blue-bg); color: #0059b3; }
html.dark .badge-progress { background: var(--blue-bg); color: var(--blue); }
.badge-done { background: var(--green-bg); color: #237a32; }
html.dark .badge-done { background: var(--green-bg); color: var(--green); }
.badge-closed { background: rgba(0,0,0,0.05); color: var(--text2); }
html.dark .badge-closed { background: rgba(255,255,255,0.08); color: var(--text2); }
.badge-pro { background: var(--navy); color: #fff; }
.badge-lock { background: rgba(0,0,0,0.05); color: var(--text2); }
.badge-ai { background: var(--navy-light); color: var(--navy); text-transform: none; letter-spacing: 0; font-weight: 500; }
.badge-ok { background: var(--green-bg); color: #237a32; text-transform: none; letter-spacing: 0; }

/* === LISTS === */
.list { display: flex; flex-direction: column; gap: 12px; }
.list-item {
  background: var(--card); border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: 16px;
  display: flex; align-items: center; gap: 14px; cursor: pointer; min-height: 52px; transition: var(--transition);
}
.list-item:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.list-item.selected { border: 2px solid var(--navy); }
.list-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 600; flex-shrink: 0; font-size: 14px; }
.list-content { flex: 1; }
.list-title { font-weight: 600; font-size: 15px; }
.list-meta { font-size: 13px; color: var(--text2); margin-top: 2px; }

/* === PROGRESS === */
.progress-bar { height: 8px; background: rgba(0,0,0,0.05); border-radius: 4px; overflow: hidden; }
html.dark .progress-bar { background: rgba(255,255,255,0.08); }
.progress-fill { height: 100%; background: var(--navy); border-radius: 4px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }

/* === SKELETON / SHIMMER === */
.skeleton {
  background: linear-gradient(90deg, rgba(0,0,0,0.06) 25%, rgba(0,0,0,0.02) 50%, rgba(0,0,0,0.06) 75%);
  background-size: 200% 100%; animation: shimmer 1.4s infinite;
  border-radius: var(--radius-sm);
}
html.dark .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0.08) 75%); background-size: 200% 100%; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* === MODALS & BOTTOM SHEETS === */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35); backdrop-filter: blur(3px);
  z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card); border-radius: var(--radius-lg); width: 100%; max-width: 560px;
  max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-float); animation: modalIn 0.25s ease;
}
.bottom-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0; max-height: 94vh; overflow-y: auto;
  padding: 22px 22px calc(22px + var(--safe-bottom)) 22px; z-index: 210;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.25,1,0.5,1);
}
.bottom-sheet.open { transform: translateY(0); }
.sheet-handle { width: 40px; height: 5px; background: var(--border); border-radius: 3px; margin: 0 auto 18px; cursor: pointer; }
@keyframes modalIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px; border-bottom: 1px solid var(--border); }
.modal-body { padding: 22px; }
.modal-footer { padding: 16px 22px 22px; display: flex; gap: 12px; }

/* === TOAST === */
.toast {
  position: fixed; bottom: calc(96px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(29,29,31,0.94); color: #fff; padding: 13px 20px; border-radius: 26px; font-size: 14px; font-weight: 500;
  box-shadow: var(--shadow-float); opacity: 0; transition: opacity 0.3s, transform 0.3s; z-index: 260; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* === AI BUBBLE / CHAT === */
.ai-bubble {
  position: fixed; bottom: calc(160px + var(--safe-bottom)); right: 20px; z-index: 120;
  display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
}
@media (min-width: 1024px) { .ai-bubble { bottom: 100px; right: 32px; } }
.ai-fab {
  width: 56px; height: 56px; border-radius: 50%; background: var(--navy); color: #fff;
  display: grid; place-items: center; box-shadow: var(--shadow-float); cursor: pointer; transition: var(--transition);
  font-weight: 700; font-size: 13px;
}
.ai-fab:hover { transform: scale(1.06); }
.ai-fab:active { transform: scale(0.95); }
.ai-card {
  width: 340px; max-width: calc(100vw - 40px); background: var(--card); border-radius: var(--radius-lg); padding: 18px;
  box-shadow: var(--shadow-float); font-size: 14px; display: none;
}
.ai-card.open { display: block; }
.ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.ai-title { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.ai-close { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--text2); cursor: pointer; transition: var(--transition); }
.ai-close:hover { background: var(--navy-light); color: var(--navy); }
.ai-msg { color: var(--text2); line-height: 1.45; margin-bottom: 14px; }
.ai-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ai-actions .btn { padding: 0 8px; font-size: 13px; }
.ai-input { display: flex; gap: 8px; margin-top: 12px; }
.ai-input input { flex: 1; min-height: 40px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); color: var(--text); }

/* === AUTH === */
.auth-page {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  background: linear-gradient(180deg, var(--bg) 0%, #eef1f5 100%);
}
html.dark .auth-page { background: linear-gradient(180deg, var(--bg) 0%, #010409 100%); }
.auth-card { background: var(--card); border-radius: var(--radius-lg); padding: 32px; width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); }
.auth-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; }
.auth-head { text-align: center; margin-bottom: 24px; }
.auth-foot { text-align: center; margin-top: 22px; font-size: 14px; color: var(--text2); }
.social-btn { width: 100%; min-height: 48px; border: 1px solid var(--border); background: var(--card); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; cursor: pointer; transition: var(--transition); font-weight: 500; }
.social-btn:hover { background: var(--navy-light); }
.code-row { display: flex; gap: 10px; justify-content: center; }
.code-input { width: 48px; height: 58px; text-align: center; font-size: 24px; font-weight: 700; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--text); transition: var(--transition); }
.code-input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px var(--navy-light); outline: none; }

/* === DASHBOARD SPECIFICS === */
.kpi-value { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.kpi-label { font-size: 13px; color: var(--text2); font-weight: 500; }
.kpi-delta { font-size: 12px; font-weight: 600; margin-top: 4px; }
.insight-item { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.insight-item:last-child { border-bottom: none; }
.insight-icon { width: 32px; height: 32px; border-radius: 50%; background: var(--navy-light); color: var(--navy); display: grid; place-items: center; font-size: 15px; flex-shrink: 0; }
.insight-icon.red { background: var(--red-bg); color: var(--red); }
.insight-icon.green { background: var(--green-bg); color: var(--green); }
.quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (min-width: 640px) { .quick-actions { grid-template-columns: repeat(4,1fr); } }

/* === PROPERTY / UNITS === */
.property-img { width: 100%; height: 160px; object-fit: cover; border-radius: var(--radius-sm); background: #ddd; }
.unit-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; background: var(--navy-light); color: var(--navy); margin-right: 6px; margin-bottom: 6px; }

/* === TABS === */
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tab { padding: 12px 16px; font-size: 14px; font-weight: 600; color: var(--text2); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; min-height: 44px; transition: var(--transition); }
.tab.active { color: var(--navy); border-bottom-color: var(--navy); }

/* === WIZARD STEPPER === */
.wizard-stepper { display: flex; gap: 8px; margin-bottom: 20px; }
.wizard-dot { flex: 1; height: 4px; border-radius: 2px; background: var(--border); transition: var(--transition); }
.wizard-dot.active { background: var(--navy); }
.wizard-dot.completed { background: var(--green); }

/* === CALENDAR === */
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
.cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; font-size: 13px; font-weight: 500; cursor: pointer; transition: var(--transition); }
.cal-day:hover { background: var(--navy-light); }
.cal-day.today { background: var(--navy); color: #fff; }
.cal-day.due-red { background: var(--red-bg); color: var(--red); }
.cal-day.due-yellow { background: var(--orange-bg); color: var(--orange); }

/* === UPLOAD === */
.upload-zone {
  border: 2px dashed var(--border); border-radius: var(--radius-md); padding: 32px; text-align: center;
  color: var(--text2); transition: var(--transition); cursor: pointer; background: var(--bg);
}
.upload-zone:hover { border-color: var(--navy); background: var(--navy-light); }

/* === SCAN FRAME === */
.scan-preview { position: relative; border-radius: var(--radius-md); overflow: hidden; }

function $(sel){ return document.querySelector(sel); }
function escapeHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
function navTo(view){ state.view=view; render(); }
function setRole(role){ state.role=role; render(); }
function setupProgress(){ const done=state.setup.filter(s=>s.done).length; return {done, total:state.setup.length, pct:Math.round(done/state.setup.length*100)}; }
function statusBadge(status){
  const map={offen:['badge-open','Offen'],in_bearbeitung:['badge-progress','In Bearbeitung'],erledigt:['badge-done','Erledigt'],geschlossen:['badge-closed','Geschlossen'],frei:['badge-closed','Frei'],vermietet:['badge-done','Vermietet'],Bewerbung:['badge-open','Bewerbung'],aktiv:['badge-done','Aktiv'],'teilweise vermietet':['badge-progress','Teilweise']};
  const [cls,label]=map[status]||['badge-closed',status];
  return '<span class="badge '+cls+'">'+label+'</span>';
}
function icon(name){ return SVG_ICONS[name]||''; }
function avatar(name){ const initials=name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase(); return '<div class="list-avatar">'+initials+'</div>'; }
function formatMoney(n){ return n.toLocaleString('de-DE',{style:'currency',currency:'EUR'}); }
function propertyImg(prop){
  const bg = prop.img ? 'background:url('+prop.img+') center/cover' : 'background:linear-gradient(135deg,var(--navy) 0%,var(--navy-hover) 100%)';
  return '<div class="property-img" style="'+bg+';display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;position:relative;">🏠<button class="btn btn-sm btn-secondary" style="position:absolute;bottom:10px;right:10px;background:rgba(255,255,255,0.95);border:none;" onclick="event.stopPropagation();app.toast(\'Foto-Upload (Demo)\')">📷</button></div>';
}

function renderNav(){
  const list=$('#nav-list');
  if(state.role==='tenant'){ list.innerHTML=''; return; }
  const items=[
    {id:'dashboard',label:'Dashboard',icon:'home'},
    {id:'properties',label:'Objekte',icon:'building'},
    {id:'tenants',label:'Mieter',icon:'users'},
    {id:'tickets',label:'Tickets',icon:'ticket'},
    {id:'costs',label:'Kosten',icon:'euro'},
    {id:'settlements',label:'Abrechnungen',icon:'file'},
    {id:'documents',label:'Dokumente',icon:'file'},
    {id:'deadlines',label:'Fristen',icon:'calendar'},
    {id:'settings',label:'Einstellungen',icon:'settings'}
  ];
  list.innerHTML=items.map(it=>{
    const active=state.view===it.id?'active':'';
    return `<li class="nav-item ${active}" onclick="app.navTo('${it.id}')">${icon(it.icon)}<span class="nav-label">${it.label}</span></li>`;
  }).join('');
}

function renderMobileTabbar(){
  const bar=$('#mobile-tabbar');
  if(isAuthView()){ bar.style.display='none'; $('#fab').style.display='none'; $('#ai-bubble').style.display='none'; return; }
  bar.style.display='flex'; $('#fab').style.display='grid'; $('#ai-bubble').style.display='flex';
  if(state.role==='tenant'){
    const tabs=[{id:'tenant-start',label:'Start',icon:'home'},{id:'tenant-tickets',label:'Tickets',icon:'ticket'},{id:'tenant-docs',label:'Dokumente',icon:'file'}];
    bar.innerHTML=tabs.map(t=>{
      const active=state.view===t.id?'active':'';
      return `<div class="tabbar-item ${active}" onclick="app.navTo('${t.id}')">${icon(t.icon)}<span>${t.label}</span></div>`;
    }).join('');
  } else {
    const tabs=[{id:'dashboard',label:'Dashboard',icon:'home'},{id:'properties',label:'Objekte',icon:'building'},{id:'tickets',label:'Tickets',icon:'ticket'},{id:'more',label:'Mehr',icon:'more'}];
    const activeMore=['costs','settlements','documents','deadlines','settings','tenants'].includes(state.view);
    bar.innerHTML=tabs.map(t=>{
      let active=state.view===t.id?'active':'';
      if(t.id==='more' && activeMore) active='active';
      return `<div class="tabbar-item ${active}" onclick="${t.id==='more'?'app.openMoreSheet()':`app.navTo('${t.id}')`}">${icon(t.icon)}<span>${t.label}</span></div>`;
    }).join('');
  }
}

function renderSpeedDial(){
  const dial=$('#speed-dial');
  const actions=state.role==='tenant'
    ? [{label:'Ticket',icon:'ticket',view:'tenant-ticket-create'}]
    : [{label:'Ticket',icon:'ticket',view:'tickets'},{label:'Kosten',icon:'euro',view:'costs'},{label:'Beleg',icon:'file',view:'costs'},{label:'Mieter',icon:'users',view:'tenant-create'},{label:'Dokument',icon:'file',view:'documents'}];
  dial.innerHTML=actions.map(a=>`<div class="speed-item"><span class="speed-label">${a.label}</span><div class="speed-btn" onclick="app.speedClick('${a.view}')">${icon(a.icon)}</div></div>`).join('');

function openMoreSheet(){

    {id:'settlements',label:'Abrechnungen',icon:'file'},
    {id:'documents',label:'Dokumente',icon:'file'},
    {id:'deadlines',label:'Fristen',icon:'calendar'},
    {id:'settings',label:'Einstellungen',icon:'settings'}
  ];
  openSheet(`<h3 style="margin-bottom:16px;font-size:20px;">Mehr</h3><div class="list">${items.map(i=>`<div class="list-item" onclick="app.closeSheet();app.navTo('${i.id}')">${icon(i.icon)}<div class="list-content"><div class="list-title">${i.label}</div></div></div>`).join('')}</div>`);
}

function openModal(html){ $('#modal').innerHTML=html; $('#modal-overlay').classList.add('open'); }
function closeModal(){ $('#modal-overlay').classList.remove('open'); }
function openSheet(html){ $('#sheet-content').innerHTML=html; $('#bottom-sheet').classList.add('open'); }
function closeSheet(){ $('#bottom-sheet').classList.remove('open'); }

function isAuthView(){ return ['login','register','2fa-setup','2fa-verify','welcome'].includes(state.view); }

function render(){
  renderNav();
  renderMobileTabbar();
  renderSpeedDial();
  updateTheme();
  document.body.classList.toggle('auth-view', isAuthView());

  $('#topbar-title').textContent=pageTitle();
  const viewFn=views[state.view] || views.dashboard;
  $('#content').innerHTML='<div class="page-enter">'+viewFn()+'</div>';
  attachHandlers();

function attachHandlers(){
  const fab=$('#fab'); if(fab){ fab.onclick=()=>{ $('#speed-dial').classList.toggle('open'); }; }
  const mo=$('#modal-overlay'); if(mo){ mo.onclick=(e)=>{ if(e.target===mo) closeModal(); }; }
  const tm=$('#theme-toggle-mobile'); if(tm){ tm.onclick=toggleTheme; }
  const ts=$('#theme-toggle-settings'); if(ts){ ts.onclick=toggleTheme; }
}

function toggleTheme(){ state.dark=!state.dark; state.themeManual=true; document.documentElement.classList.toggle('dark', state.dark); toast(state.dark?'Dark Mode aktiviert':'Light Mode aktiviert'); }
function updateTheme(){ document.documentElement.classList.toggle('dark', state.themeManual?state.dark:window.matchMedia('(prefers-color-scheme: dark)').matches); }

function speedClick(view){ $('#speed-dial').classList.remove('open'); if(view==='tickets') openTicketCreate(); else if(view==='tenant-create') navTo('tenant-create'); else if(view==='costs') openCostScan(); else navTo(view); }

function toggleAI(){ state.aiOpen=!state.aiOpen; $('#ai-card').classList.toggle('open', state.aiOpen); }
function closeAI(){ state.aiOpen=false; $('#ai-card').classList.remove('open'); }
function askMax(){ const q=$('#ai-ask'); if(q && q.value.trim()){ $('#ai-msg').textContent='Gute Frage! Ich kann dir dabei helfen. Schau mal unter "Einstellungen" oder starte ein Objekt.'; q.value=''; } else { $('#ai-msg').textContent='Frage mich zu Objekten, Mietern oder Abrechnungen.'; } }

function setupChecklistHtml(){
  const p=setupProgress();
  const rows=state.setup.map(s=>{
    const icon=s.done?'<span style="color:var(--navy);font-weight:700;">✓</span>':'<span style="color:var(--text2);">○</span>';
    return '<div class="flex items-center gap-2" style="font-size:14px;padding:5px 0;color:'+(s.done?'var(--text2)':'var(--text)')+'">'+icon+' '+s.label+'</div>';
  }).join('');
  return '<div class="card card-xl mb-3"><div class="flex justify-between items-center mb-2"><div><div class="card-title">Setup-Checkliste</div><div class="card-sub">'+p.pct+' % erledigt</div></div>'+(p.pct<100?'<button class="btn btn-sm btn-ghost" onclick="app.dismissSetup()">×</button>':'')+'</div><div class="progress-bar mb-3"><div class="progress-fill" style="width:'+p.pct+'%"></div></div>'+rows+'</div>';
}

function dismissSetup(){ state.showSetup=false; render(); }
