[pytest]
minversion = 7.0
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests/phase0 tests/phase1
pythonpath = .
addopts = -v --tb=short
markers =
    phase0: Phase 0 tests (dev environment, DB, Redis, health).
    phase1: Phase 1 tests (auth, 2FA, DSGVO, security, audit).
    slow: Langlaufende oder zeitkritische Tests (z. B. Rate-Limiting).
    integration: Integrationstests mit echter DB/Redis.
