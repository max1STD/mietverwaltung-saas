name: Generate API Types

on:
  push:
    paths:
      - "backend/app/schemas/**"
      - ".github/workflows/generate-api-types.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r backend/requirements.txt
      - name: Ensure shared directories exist
        run: mkdir -p shared/openapi shared/types
      - name: Export OpenAPI spec
        run: |
          cd backend
          python -c "from app.main import app; import json; print(json.dumps(app.openapi()))" > ../shared/openapi/openapi.json
      - run: npx openapi-typescript shared/openapi/openapi.json -o shared/types/api.d.ts
      - name: Verify API types are up-to-date
        run: |
          git diff --exit-code shared/openapi/openapi.json shared/types/api.d.ts || {
            echo "::error::Shared API types are out of date. Run 'cd backend && python -c \"from app.main import app; import json; print(json.dumps(app.openapi()))\" > ../shared/openapi/openapi.json && npx openapi-typescript shared/openapi/openapi.json -o shared/types/api.d.ts' and commit the result."
            exit 1
          }
